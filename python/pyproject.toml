[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rang-palettes"
version = "0.1.0"
description = "Color palettes from Persian art for plots and maps"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Mohsen Tahmasebi Nasab" }]
keywords = ["color", "palette", "colormap", "persian art", "visualization"]

[project.urls]
Homepage = "https://github.com/mohsennasab/Rang"

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["rang*"]
